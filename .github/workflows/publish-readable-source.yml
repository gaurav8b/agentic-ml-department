name: Publish readable source tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-readable-source.yml"
      - ".source/agentic-ml-department-source.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and expand the committed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c CHECKSUMS.txt
          temp_dir="$(mktemp -d)"
          tar -xJf .source/agentic-ml-department-source.tar.xz -C "$temp_dir"
          source_dir="$temp_dir/agentic-ml-department"
          test -d "$source_dir/src"
          test -d "$source_dir/tests"
          test -f "$source_dir/docker-compose.yml"
          for directory in src tests dashboard scripts docs; do
            test -d "$source_dir/$directory"
            rm -rf "$directory"
            cp -a "$source_dir/$directory" .
          done
          for file in README.md .env.example Dockerfile docker-compose.yml pyproject.toml requirements.txt Makefile LICENSE .gitignore .dockerignore; do
            if [ -f "$source_dir/$file" ]; then
              cp "$source_dir/$file" .
            fi
          done
          rm -rf "$temp_dir"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile and test the extracted source
        run: |
          python -m compileall -q src tests dashboard scripts
          pytest -q

      - name: Commit readable project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/*.egg-info .pytest_cache
          find src tests dashboard scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .env.example Dockerfile docker-compose.yml pyproject.toml requirements.txt Makefile LICENSE .gitignore .dockerignore src tests dashboard scripts docs
          if git diff --cached --quiet; then
            echo "The source tree is already published."
          else
            git commit -m "Publish readable Python source tree and POC runbook"
            git push origin HEAD:main
          fi
