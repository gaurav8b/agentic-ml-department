[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ml-department"
version = "0.1.0"
description = "A human-supervised, agentic machine-learning department prototype for a synthetic business."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic ML Department contributors" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
agentic-ml = "agentic_ml_department.cli:main"
